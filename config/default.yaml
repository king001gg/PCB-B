# ============================================================================
# PCB 阻焊前喷砂质量在线检测系统 — 统一配置文件
# ============================================================================
# 本文件定义系统、检测算法、相机、PLC 等全部参数。
# 修改后无需重启软件，支持实时重载（检测模块在每次运行前读取最新值）。
# ============================================================================

system:
  mode: "offline"          # online（相机实时） | offline（文件加载）
  image_dir: "data/samples" # 离线模式下的图像目录
  # 相机编号与触发模式已统一收进 camera 节（camera.device.index /
  # camera.trigger），此处不再保留 —— 两处配置同一件事只会互相打架。
  resolution_mm_per_pixel: 0.01   # 图像空间分辨率
  board_width_mm: 200             # PCB 板宽度（用于面积百分比计算）
  board_height_mm: 150            # PCB 板高度

# ----------------------------------------------------------------------------
# 检测参数
# ----------------------------------------------------------------------------
inspection:
  # --- ROI 提取 ---
  roi:
    enabled: false                 # 是否启用 ROI 自动提取
    copper_hsv_lower: [0, 30, 60]  # 铜面 HSV 下界 (H, S, V)
    copper_hsv_upper: [25, 255, 255] # 铜面 HSV 上界

  # --- 图像预处理 ---
  preprocessing:
    retinex:
      enabled: true
      sigma: [15, 80, 250]         # 多尺度 Retinex 高斯核 σ
      gain: 128                    # MSRCR 增益
      offset: 128                  # MSRCR 偏置
    clahe:
      enabled: true
      clip_limit: 2.0              # CLAHE 对比度裁剪限制
      tile_size: [8, 8]            # CLAHE 网格尺寸

  # --- 纹理特征提取 ---
  texture:
    glcm:
      distances: [1, 3, 5]         # 像素距离
      angles: [0, 45, 90, 135]     # 角度（度）
      levels: 256                  # 灰度级数
      symmetric: true              # 对称 GLCM
      normalize: true              # 归一化
    lbp:
      radius_list: [1, 2, 3]       # LBP 半径
      n_points_list: [8, 16, 24]   # 每半径采样点数
      method: "uniform"            # uniform | default | var
    gabor:
      orientations: 8              # 滤波器方向数（均匀分布 0~π）
      scales: [3, 5, 7]            # 滤波器核尺寸（像素）
      frequencies: [0.1, 0.3, 0.5] # 中心频率（周期/像素）
    cv_window: 32                  # 变异系数（CV）滑动窗口大小（像素）
    local_entropy_window: 9        # 局部熵窗口大小

  # --- 工艺参数监测（继电器口径 GLCM） ---
  # 与上面的 texture.glcm 是两套独立口径，互不影响：
  #   texture.glcm        256 级量化、距离 [1,3,5] → 供缺陷检测与分类器
  #   process_monitor     8 级量化、距离 1        → 供工艺面板与报警判定
  # 阈值 0.3 / 0.5 / 2.0 是在 8 级量化下标定的，改成 256 级会使其完全失效。
  process_monitor:
    enabled: true
    glcm:
      levels: 8                  # 灰度量化级数（须为 8，阈值依赖此口径）
      distance: 1                # 像素距离
      angles: [0, 45, 90, 135]   # 角度（度），输出取其平均
    resize_long_side: 640        # 统一分辨率口径，保证离线与在线结果一致
    # !!! 以下为临时标定值，尚未用现场数据验证 !!!
    # 继电器原值 0.3 / 0.5 / 2.0 标定自动触簧图像，直接套用到 PCB 喷砂图会让
    # 全部板卡落入报警区间：实测 data/samples 下 6 张样本 contrast 仅
    # 0.084 ~ 0.182（中位 0.141），没有一张能到 0.3。报警灯若恒亮即失去意义。
    # 下面这组按该分布取：报警下界取样本最小值再留余量，偏小上界取样本下四分位附近。
    # 采到真实良品/不良品图像后必须重新标定 —— 只改这里，无需改代码。
    thresholds:
      contrast_low_alarm: 0.08   # 低于此值触发闪烁报警（临时值）
      contrast_low_warn: 0.11    # 低于此值判「偏小」（临时值）
      contrast_high: 0.22        # 高于此值判「偏大」（临时值）
      # 建议速度公式 speed = speed_base - contrast。继电器原基数 3.0 是按
      # contrast ~1.38 的量级定的；PCB 的 contrast 只有 0.1 上下，沿用 3.0 会让
      # 建议速度恒为 2.86~2.92、几乎不随纹理变化，等于没有建议。故同步缩放。
      speed_base: 0.5            # 建议速度公式基数（临时值）
    # 建议文案模板，{speed:.2f} 会被替换为建议速度值。
    # 若现场实际调节的是喷砂压力或磨料粒度而非移动速度，改这里即可，无需改代码。
    advice:
      alarm: "提高速度到 {speed:.2f}"
      low: "提高速度到 {speed:.2f}"
      high: "降低速度到 {speed:.2f}"
      normal: "纹理清晰，检测环境理想"

  # --- 缺陷检测 ---
  defects:
    oxidation:
      enabled: true
      h_range: [10, 30]            # 氧化色相范围（背离金色铜面）
      s_min: 25                    # 饱和度下界（氧化斑饱和度较低）
      v_min: 35                    # 明度下界
      area_min_px: 50              # 最小连通域面积（像素）
    embedding:
      enabled: true
      kernel_size: [15, 15]        # Top-hat 结构元尺寸
      threshold_binary: 30          # 二值化阈值
      area_min_px: 5               # 最小磨料斑点面积（像素）
    unroughened:
      enabled: true
      energy_threshold: 0.12       # GLCM 能量阈值（低于此值视为未粗化）
      area_min_px: 100             # 最小未粗化区域面积（像素）

  # --- 缺陷分类 ---
  classifier:
    type: "svm"                    # svm | mobilenet
    svm_model: "models/svm_classifier.pkl"
    mobilenet_model: "models/mobilenet_classifier.pt"
    feature_dim: 128               # 输入特征维度
    confidence_threshold: 0.5

  # --- 质量评估 ---
  quality:
    roughness_cv_max: 0.35         # 粗糙度 CV 容忍上限
    direction_consistency_min: 0.6 # 锚纹方向一致性下限 (0~1)
    oxidation_max_pct: 5.0         # 氧化斑面积百分比容忍上限
    embedding_max_count: 10        # 磨料嵌入计数容忍上限
    unroughened_max_pct: 3.0       # 未粗化面积百分比容忍上限
    ok_score_threshold: 60         # OK/NG 判定分数阈值（0~100）

  # --- 色度 / 饱和度（只监测，不进总分、不影响 OK/NG） ---
  #
  # 补的是氧化面积法的结构性盲区：均匀的薄氧化膜不产生连通域，面积比接近 0
  # 会被判为良品，而这层膜恰恰影响焊接/层压附着力。色相偏移 ΔH 与饱和度下降
  # ΔS 是全局面统计量，对均匀变色敏感且不需要连通域。
  #
  # ⚠ 下列阈值全部是**占位值，尚未用现场彩色样本标定**（与本节其它阈值同）。
  #   第一版只监测不入总分，目的正是先拿到真实分布再定阈值。详见 core/color.py。
  color:
    enabled: true
    color_order: "rgb"             # 输入通道顺序，bgr | rgb。**必须与喂进来的
                                   # 字节顺序一致**——这个量无法从数组形状推断，
                                   # 喂错不报错、只会静默把色相转掉 172°。
                                   # GUI/CLI 在入口做了 BGR2RGB，故默认 rgb；
                                   # 从采集器直接取帧的路径显式传 bgr。
    hue_s_min: 30                  # 只对 S≥此值的像素做色相统计。近中性像素的
                                   # H 由最低位抖动决定，是纯噪声（氧化阈值
                                   # s_min=25，这里取 30 更保守）
    use_roi: false                 # ROI 默认关：铜面 ROI 的判据本身是色相，而
                                   # 这正是本指标要测的量——均匀氧化会被 ROI
                                   # 排除掉，恰好废掉主用途。且全幅分母与
                                   # oxidation_percentage 同口径，便于对照
    area_min_px: 100               # 越界区域的最小面积（像素），小于此值不单独成区域
    morph_kernel: 5                # 形态学开闭运算核尺寸，去噪点、补空洞
    max_regions: 50                # 单帧最多保留多少处越界区域（按面积降序）
    absolute:
      enabled: true                # 绝对阈值：抓整板均匀变色（面积法的盲区）
      hue_baseline_deg: 34.0       # 金色铜面基准色相（度）。实测 BGR(60,140,200)
                                   # 的 H=17（OpenCV 单位），×2 = 34°
      hue_tolerance_deg: 25.0      # 色相容差。取自 roi.copper_hsv 窗口 [0,25] 的
                                   # 半宽 12.5 × 2 = 25°
      sat_baseline: 178.0          # 亮金基准饱和度。实测 (60,140,200) → S=178
                                   # （S 的分母是 V，故对整体明暗不敏感，只对
                                   # 最亮/最暗通道的差距敏感）
      sat_tolerance: 50.0          # 饱和容差，约当亮金 S 的 28%。任何让 R 与 B
                                   # 靠拢的变化（氧化膜、油污、指纹）都会压低 S
    adaptive:
      enabled: true                # 自适应阈值：抓局部异常（油污/水渍/指纹）
      mad_k: 3.0                   # 阈值 = mad_k × 1.4826 × MAD，与 SPC 3σ 同源
      min_hue_tol_deg: 8.0         # 色相容差下限。圆中位数有 2° 量化下限，
                                   # 取 8° 是它的 4 倍，避免阈值退化到量化噪声上
      min_sat_tol: 20.0            # 饱和容差下限，防止整板极均匀时阈值过紧
      min_valid_pixels: 1000       # 有效色相像素少于此值时基线不可信，
                                   # 本帧只出绝对判据、自适应判据留空

# ----------------------------------------------------------------------------
# 输出设置
# ----------------------------------------------------------------------------
output:
  save_result_image: true          # 是否保存标注结果图
  save_heatmap: true               # 是否保存热力图
  result_dir: "results"            # 结果输出目录
  database: "sqlite:///data/inspection.db"  # 数据库连接字符串
  log_level: "INFO"                # 日志级别

# ----------------------------------------------------------------------------
# PLC 通信
# ----------------------------------------------------------------------------
plc:
  enabled: false
  protocol: "modbus_rtu"           # modbus_rtu | modbus_tcp
  port: "COM1"                     # 串口号（RTU）
  host: "192.168.1.100"            # IP 地址（TCP）
  tcp_port: 502                    # TCP 端口
  baudrate: 9600                   # 波特率（RTU）
  slave_id: 1                      # 从站地址
  timeout_ms: 1000                 # 超时（毫秒）
  coil_ok: 0                       # OK 信号线圈地址
  coil_ng: 1                       # NG 信号线圈地址
  register_quality: 100            # 质量分数保持寄存器地址

# ----------------------------------------------------------------------------
# 工业相机设置
# ----------------------------------------------------------------------------
camera:
  driver: "mvs"                    # mvs（海康官方 SDK，默认）| opencv | harvesters（通用 GenICam）
  width: 2448                      # 图像宽度（像素）
  height: 2048                     # 图像高度（像素）
  exposure_us: 5000                # 曝光时间（微秒）
  gain: 1.0                        # 模拟增益
  pixel_format: "BGR8"             # 像素格式。Mono8/Mono10/Mono12/RGB8/BGR8，
                                   # 也可直接填 SDK 枚举名（如 BayerRG8）。
                                   # ⚠ 由 Mono8 改为 BGR8，**未现场验证、仅占位**：
                                   # 色度/饱和度指标需要彩色输入（灰度下该指标自动
                                   # 跳过并标注）。选 BGR8 而不是 RGB8，是因为
                                   # CameraBase 的契约就是 BGR，上层 _to_rgb 会再
                                   # 转成 RGB 给 GUI——填 RGB8 会让红蓝被换两次。
                                   # 两种驱动都能落地这行值：通用 GenICam 驱动直接
                                   # 用它（BGR8 就是 PFNC 标准名），MVS 驱动经
                                   # _PIXEL_FORMAT_ALIASES 翻成 BGR8_Packed
  device:
    index: 0                       # opencv：摄像头编号；mvs/harvesters：按枚举顺序选
    serial_number: ""              # 多台相机时按序列号绑定，留空 = 第一台。
                                   # 网口插拔顺序会变，靠「第一台」会拍错工位
  trigger:
    mode: "continuous"             # continuous（连续采集）| software（软触发）| external（外部信号）
    source: "Line0"                # 触发源，仅 external 时有效
  acquire_timeout_ms: 2000         # 单次取帧超时（毫秒）

# ----------------------------------------------------------------------------
# 数据处理
# ----------------------------------------------------------------------------
data_processing:
  moving_average_window: 10        # 指标滑动平均窗口
  alert_threshold_consecutive: 3   # 连续 NG 达此数则触发预警
  spc_control_limit: 3.0           # SPC 控制限 σ 倍数
