[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=core
    --cov=hardware
    --cov=ui
    --cov=utils
    --cov-report=term-missing:skip-covered
    --cov-report=html:results/coverage
    --cov-report=xml:results/coverage.xml

# hardware 标记的用例需要真实相机 / PLC，无硬件的机器上这样跳过：
#     pytest -m "not hardware"
markers =
    hardware: 需要真实相机或 PLC 硬件的用例（CI 上应跳过）
    slow: 耗时较长（>1s）的用例

filterwarnings =
    default
